<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@TITLE@</title>
    <!-- Static hosts like GitHub Pages can't send the COOP/COEP headers that
         love.js needs; this service worker adds them (no-op when already set). -->
    <script src="coi-serviceworker.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0f1d;
        color: #c2c3c7;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      main { text-align: center; padding: 16px; }
      a { color: #29adff; }
      canvas {
        aspect-ratio: @WIDTH@ / @HEIGHT@;
        width: min(92vw, calc(92vh * @WIDTH@ / @HEIGHT@), 960px) !important;
        height: auto !important;
        image-rendering: pixelated;
        display: block;
        margin: 12px auto;
        border-radius: 6px;
        box-shadow: 0 0 0 4px #1d2b53, 0 20px 60px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="game"></div>
    </main>
    <script>
      (function () {
        var s = document.createElement("script");
        s.src = "player.js?g=@GAME@.love&v=11.5&n=1";
        document.getElementById("game").appendChild(s);
      })();
    </script>
  </body>
</html>
